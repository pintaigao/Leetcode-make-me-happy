<button id="start">Start</button>
<button id="cancel">Cancel</button>

<script>
  class CancelToken {
    constructor(cancelFn) {
      this.promise = new Promise((resolve, reject) => {
        cancelFn(() => {
          setTimeout(console.log, 0, "delay cancelled");
          resolve('cancel');
        });
      });
    }
  }

  const startButton = document.querySelector('#start');
  const cancelButton = document.querySelector('#cancel');

  function cancellableDelayedResolve(delay) {
    setTimeout(console.log, 0, "set delay");

    return new Promise((resolve, reject) => {
      const id = setTimeout((() => {
        setTimeout(console.log, 0, "delayed resolve");
        resolve('resolve');
      }), delay);

      const cancelToken = new CancelToken((cancelCallback) => cancelButton.addEventListener("click", cancelCallback));
      // CancelToken ()接受一个 function作为参数，形式是这样的（arg） => { do something with arg }，然后在 constructor 里面，function 被调用，具体的 arg 被传进去。
      // 在这里 resolve（）作为 arg 被传进去，cancelCallback 就是 resolve()，当 cancelButton 被点击时，cancelCallback 就会被调用，也就是 resolve() 被调用，这样 cancelToken.promise 就会被 resolved。
      // 这里的 cancelToken.promise.then() 就是当 cancelToken.promise 被 resolved 时，执行 clearTimeout(id)，也就是取消之前设置的 setTimeout。
      cancelToken.promise.then((result) => { clearTimeout(id); resolve(result); });
    });
  }

  startButton.addEventListener("click", () => cancellableDelayedResolve(2000).then(result => console.log(result))); 
</script>
